name: CI                          # Name der Pipeline (erscheint im Actions-Tab)

on:                               # Wann soll die Pipeline starten?
  push:                           # Bei jedem Push...
    branches: [ main ]            # ...aber nur auf den main-Branch
  pull_request:                   # Und bei Pull Requests...
    branches: [ main ]            # ...die nach main gehen

jobs:                             # Liste der Jobs (hier nur einer)
  build-and-test:                 # Frei wählbarer Job-Name
    runs-on: ubuntu-latest        # Auf welchem Runner/Betriebssystem laufen soll

    steps:                        # Die einzelnen Schritte des Jobs, von oben nach unten
      - name: Checkout code       # Schritt 1: dein Repo-Code...
        uses: actions/checkout@v4 # ...wird auf den Runner geladen (fertige Action)

      - name: Set up JDK 26       # Schritt 2: Java installieren
        uses: actions/setup-java@v4
        with:                     # Konfiguration für diese Action:
          distribution: temurin   # Java-Distribution (Eclipse Temurin)
          java-version: '26'      # Java-Version, passend zu deiner pom.xml
          cache: maven            # Maven-Abhängigkeiten cachen = schnellere Builds

      - name: Make mvnw executable # Schritt 3: Wrapper ausführbar machen
        run: chmod +x mvnw        # Shell-Befehl: setzt Ausführ-Recht auf Linux

      - name: Build and run tests  # Schritt 4: das eigentliche Bauen + Testen
        run: ./mvnw --batch-mode --no-transfer-progress test
                                  # ./mvnw = Maven-Wrapper aus dem Projekt
                                  # --batch-mode = keine interaktiven Abfragen (CI-tauglich)
                                  # --no-transfer-progress = kein Download-Spam im Log
                                  # test = kompiliert und führt alle JUnit-Tests aus